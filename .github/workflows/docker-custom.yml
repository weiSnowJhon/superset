name: Build and Push Superset Custom

on:
  push:
    branches: [ "dev-from-6.0.0" ]  # 当你推送到 dev-from-6.0.0 分支时触发
# 关键：允许手动触发
  workflow_dispatch:
    inputs:
      tags:
        description: '镜像版本标签 (例如: v1.0.1)'
        required: false
        default: 'latest'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/superset-custom:latest
          # 加上缓存优化，下次构建更快
          cache-from: type=gha
          cache-to: type=gha,mode=max